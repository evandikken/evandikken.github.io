<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evan Dikken Apps</title>
<meta name="description" content="Games and apps by Evan Dikken.">
<style>
  :root {
    --bg: #fbf8f3;
    --text: #2b1b3d;
    --muted: #5e5070;
    --accent: #6b4fc8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16132e;
      --text: #f2ecfa;
      --muted: #b6a9cc;
      --accent: #b9a6ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { margin: 0 0 8px; }
  p { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
<h1>Evan Dikken</h1>
<p>Independent games and apps from the Netherlands.</p>
<h2>Parry Plane</h2>
<ul>
  <li><a href="https://play.google.com/store/apps/details?id=nl.evan.parryplane">Get it on Google Play</a></li>
  <li><a href="https://apps.apple.com/app/parry-plane/id6823236082">Download on the App Store</a></li>
  <li><a href="parry-plane/privacy/">Privacy policy</a></li>
</ul>
<p>Contact: <a href="mailto:evan.apps.nl@gmail.com">evan.apps.nl@gmail.com</a></p>
</main>
</body>
</html>
